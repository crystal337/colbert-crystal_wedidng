<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colbert &amp; Crystal 婚宴座位</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600&display=swap">
<style>
/* Layout: sticky header with four steps; work area = side panel + scaled floor plan of the banquet hall. */
:root {
  --bg: #FAF5EB;          /* cream page */
  --paper: #FFFDF8;       /* panels, tablecloth */
  --floor: #F3EBDC;       /* hall floor */
  --line: #E8DCC8;
  --line-strong: #D5C3A5;
  --ink: #4B3F35;
  --ink-soft: #8B7966;
  --ink-faint: #B4A38D;
  --accent: #A7835F;      /* warm caramel */
  --accent-deep: #8A6A4A;
  --accent-ink: #FFFDF8;
  --accent-soft: #F0E4D2;
  --rose: #C98F86;
  --rose-soft: #F7E6E1;
  --sage: #7F9773;
  --sage-soft: #E6ECDD;
  --scrim: rgba(75, 63, 53, .34);
  --shadow: 0 1px 2px rgba(98, 74, 48, .08), 0 8px 22px rgba(98, 74, 48, .07);
  --f-display: "Cormorant Garamond", "Noto Serif TC", Georgia, serif;
  --f-serif-tc: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.mono, .step .n, .tbl-num, .stepper output, .ov-card li .sn, .seat .no, .floor-label { font-variant-numeric: lining-nums tabular-nums; }

.app { max-width: 1680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }

/* ---------- header ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 14px 12px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mono { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; font-family: var(--f-display); font-weight: 600; font-size: 17px; letter-spacing: .02em; color: var(--accent-deep); background: var(--paper); flex: none; }
.brand h1 { font-family: var(--f-serif-tc); font-weight: 600; font-size: 20px; letter-spacing: .08em; }
.brand p { margin: 0; font-family: var(--f-display); font-size: 15px; color: var(--ink-soft); letter-spacing: .04em; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 8px; padding: 7px 14px 7px 8px; border-radius: 999px; border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--ink-soft); }
.step .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-strong); font-family: var(--f-display); font-weight: 700; font-size: 14px; }
.step:hover { background: var(--paper); }
.step.on { background: var(--paper); border-color: var(--line-strong); color: var(--ink); box-shadow: var(--shadow); }
.step .lbl-short { display: none; }
.step.on .n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.stats { display: flex; gap: 14px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.stats b { color: var(--ink); font-weight: 600; }
.saved { font-size: 12px; color: var(--ink-faint); }

.banner { margin-top: 14px; padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-deep); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.banner span { flex: 1 1 260px; }

/* ---------- generic ---------- */
.work { margin-top: 16px; display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; align-items: start; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.panel + .panel { margin-top: 12px; }
.panel h2 { font-family: var(--f-serif-tc); font-weight: 600; font-size: 16px; letter-spacing: .06em; display: flex; align-items: baseline; gap: 8px; }
.panel h2 small { font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--ink-soft); letter-spacing: 0; }
.eyebrow { font-size: 11px; letter-spacing: .14em; color: var(--ink-faint); text-transform: uppercase; margin: 14px 0 6px; }
.hint { font-size: 12.5px; color: var(--ink-soft); margin: 6px 0 10px; }
.hint code { background: var(--accent-soft); padding: 0 4px; border-radius: 4px; font-size: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 8px; }
.btn { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--paper); cursor: pointer; line-height: 1.3; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-deep); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-soft); padding-inline: 8px; }
.btn.quiet:hover { color: var(--ink); background: var(--accent-soft); }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.armed { background: var(--rose); border-color: var(--rose); color: #fff; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.file { position: relative; overflow: hidden; }
.btn.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.iconbtn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--paper); cursor: pointer; display: grid; place-items: center; line-height: 1; padding: 0; }
.iconbtn:hover { background: var(--accent-soft); }
:is(.btn, .iconbtn, .step, .chip, input, select, textarea):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], input[type=number], input[type=search], select, textarea { border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; background: var(--bg); width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; background: var(--paper); }
textarea { resize: vertical; line-height: 1.6; }
label.f { display: grid; gap: 4px; font-size: 12px; color: var(--ink-soft); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper output { min-width: 30px; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-soft); cursor: pointer; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--g, var(--line)); flex: none; box-shadow: inset 0 0 0 1px rgba(75, 63, 53, .12); }

/* ---------- step 1: guests ---------- */
.guests-step { margin-top: 16px; display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; align-items: start; }
.gchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.gchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 12.5px; cursor: pointer; }
.gchip.on { border-color: var(--accent); background: var(--accent-soft); }
.gchip b { font-weight: 600; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; max-height: calc(100dvh - 280px); min-height: 320px; overflow-y: auto; border-top: 1px solid var(--line); }
table.glist { width: 100%; border-collapse: collapse; min-width: 560px; }
.glist th { position: sticky; top: 0; background: var(--paper); text-align: left; font-weight: 500; font-size: 12px; color: var(--ink-soft); padding: 8px 6px; border-bottom: 1px solid var(--line); z-index: 1; }
.glist td { padding: 3px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.glist td.idx { width: 36px; color: var(--ink-faint); font-variant-numeric: tabular-nums; font-size: 12px; }
.glist input { background: transparent; border-color: transparent; padding: 5px 7px; }
.glist input:hover { border-color: var(--line); }
.glist td.where { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; }
.glist tr.dup input[data-gf=name] { background: var(--rose-soft); }
.glist .gcell { display: flex; align-items: center; gap: 6px; }
.empty { padding: 28px 12px; text-align: center; color: var(--ink-soft); }

/* ---------- floor plan ---------- */
.canvas-panel { padding: 0; overflow: hidden; }
.canvas-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.canvas-bar .title { font-family: var(--f-serif-tc); font-weight: 600; letter-spacing: .06em; margin-right: auto; }
.zoom { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink-soft); min-width: 42px; text-align: center; }
.floor-scroll { height: calc(100dvh - 190px); min-height: 460px; overflow: auto; background: var(--bg); position: relative; }
.floor-size { position: relative; margin: 0 auto; }
.floor { position: absolute; left: 0; top: 0; transform-origin: 0 0; background-color: var(--floor); background-image: radial-gradient(circle, rgba(167, 131, 95, .22) 1px, transparent 1.3px); background-size: 20px 20px; border: 2px solid var(--line-strong); border-radius: 6px; }
.floor-label { position: absolute; right: 14px; bottom: 10px; font-family: var(--f-display); font-size: 15px; color: var(--ink-faint); letter-spacing: .1em; pointer-events: none; }

.tbl { position: absolute; transform: translate(-50%, -50%); touch-action: none; }
.floor.layout .tbl, .floor.layout .decor { cursor: move; }
.floor.assign .tbl { cursor: pointer; }
.tbl-top { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--paper); border: 1.5px solid var(--line-strong); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 4px; text-align: center; transition: background .12s, border-color .12s; }
.tbl-top.round { border-radius: 50%; }
.tbl-top.rect { border-radius: 10px; }
.tbl-num { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: .95; color: var(--ink); }
.tbl-num.word { font-family: var(--f-serif-tc); font-size: 16px; font-weight: 600; letter-spacing: .08em; line-height: 1.2; }
.tbl-sub { font-size: 10.5px; color: var(--ink-soft); max-width: 92%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cnt { font-size: 11px; font-variant-numeric: tabular-nums; padding: 0 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-deep); }
.cnt.full { background: var(--sage-soft); color: var(--sage); }
.tbl.sel .tbl-top { outline: 2px solid var(--accent); outline-offset: 4px; }
.tbl.drop-hover .tbl-top { background: var(--rose-soft); border-color: var(--rose); }

.seat { position: absolute; border-radius: 50%; display: grid; place-items: center; text-align: center; background: var(--paper); border: 1.5px dashed var(--line-strong); color: var(--ink-faint); font-size: 10px; line-height: 1.1; overflow: hidden; white-space: nowrap; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: box-shadow .1s, transform .1s; }
.seat.filled { border-style: solid; border-color: rgba(75, 63, 53, .28); background: var(--g); color: var(--ink); cursor: grab; touch-action: none; }
.seat.drop-hover { box-shadow: 0 0 0 3px var(--rose); transform: scale(1.12); z-index: 2; }
.seat.dragging-src { opacity: .35; }
.seat.big { font-size: 12.5px; white-space: normal; line-height: 1.2; padding: 6px; word-break: break-all; }
.seat.big .no { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--ink-soft); font-family: var(--f-display); font-weight: 700; }
.seat.big .nm { margin-top: 8px; }
.seat.big .nt { display: block; font-size: 10px; color: var(--ink-soft); }
.floor.layout .seat { opacity: .75; }

.decor { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; text-align: center; border-radius: 10px; font-family: var(--f-serif-tc); font-weight: 600; letter-spacing: .3em; font-size: 15px; color: var(--accent-deep); background: var(--paper); border: 1.5px dashed var(--line-strong); padding: 4px; overflow: hidden; touch-action: none; user-select: none; }
.decor.k-stage { background: var(--accent-soft); border: 1.5px solid var(--accent); font-size: 20px; letter-spacing: .6em; }
.decor.k-dance { background: repeating-conic-gradient(var(--paper) 0 25%, var(--accent-soft) 0 50%) 0 0 / 40px 40px; border-style: solid; }
.decor.k-door { background: transparent; border: 2px solid var(--ink-soft); border-top-style: dashed; color: var(--ink-soft); font-size: 13px; }
.decor.sel { outline: 2px solid var(--accent); outline-offset: 4px; }

/* ---------- guest pool ---------- */
.pool { display: flex; flex-direction: column; max-height: calc(100dvh - 120px); position: sticky; top: 92px; }
.pool.drop-hover { background: var(--rose-soft); border-color: var(--rose); }
.pool-list { overflow-y: auto; min-height: 120px; margin: 8px -6px 0; padding: 0 6px 6px; flex: 1; }
.ghead { display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; font-size: 12.5px; color: var(--ink-soft); }
.ghead:first-child { margin-top: 2px; }
.ghead .btn { margin-left: auto; }
.chips { display: grid; gap: 5px; }
.chip { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; font-size: 13.5px; }
.chip:hover { border-color: var(--line-strong); }
.chip.sel { border-color: var(--accent); background: var(--accent-soft); }
.chip .nt { margin-left: auto; font-size: 11px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.chip.dragging-src { opacity: .4; }
.selbar { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--accent-deep); background: var(--accent-soft); border-radius: 8px; padding: 4px 4px 4px 10px; margin-top: 8px; }
.selbar .btn { margin-left: auto; }
.done-note { padding: 24px 8px; text-align: center; color: var(--sage); font-family: var(--f-serif-tc); letter-spacing: .06em; }

.ghost { position: fixed; z-index: 1000; pointer-events: none; left: 0; top: 0; background: var(--ink); color: var(--paper); padding: 6px 13px; border-radius: 999px; font-size: 13px; box-shadow: 0 8px 24px rgba(75, 63, 53, .3); white-space: nowrap; }

/* ---------- modal ---------- */
.modal-back { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--paper); border-radius: 20px; width: min(1040px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(75, 63, 53, .25); }
.modal-head { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.modal-head .f { flex: 1 1 140px; }
.modal-body { display: grid; grid-template-columns: minmax(0, 1fr) 270px; min-height: 0; }
.big-wrap { background: var(--floor); display: grid; place-items: center; padding: 24px 12px; overflow: auto; }
.big-wrap .tbl { position: relative; transform: none; }
.big-wrap .tbl-num { font-size: 44px; }
.big-wrap .tbl-num.word { font-size: 22px; }
.modal-pool { border-left: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; max-height: 70dvh; }
.modal-pool.drop-hover { background: var(--rose-soft); }
.modal-foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--line); }
.modal-foot .hint { margin: 0 auto 0 0; flex: 1 1 260px; }

/* ---------- step 4: overview ---------- */
.ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 16px; }
.ov-card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; break-inside: avoid; }
.ov-card h3 { font-family: var(--f-serif-tc); font-weight: 600; font-size: 16px; letter-spacing: .06em; display: flex; align-items: baseline; gap: 8px; }
.ov-card h3 .cnt { margin-left: auto; font-family: var(--f-body); letter-spacing: 0; font-weight: 400; }
.ov-card .sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.ov-card ol { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.ov-card li { display: grid; grid-template-columns: 22px 10px 1fr; gap: 8px; align-items: center; font-size: 13.5px; }
.ov-card li .sn { font-family: var(--f-display); font-weight: 700; color: var(--ink-faint); text-align: right; font-variant-numeric: tabular-nums; }
.ov-card li.emp { color: var(--ink-faint); }
.ov-card li .nt { font-size: 11px; color: var(--ink-soft); margin-left: 6px; }
.export { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 16px; }
.export textarea { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; height: 120px; }

.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 12px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 1100; max-width: calc(100vw - 32px); text-align: center; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 980px) {
  .guests-step, .work { grid-template-columns: minmax(0, 1fr); }
  .pool { position: static; max-height: 46dvh; }
  .floor-scroll { height: 62dvh; min-height: 360px; }
  .modal-body { grid-template-columns: minmax(0, 1fr); }
  .modal-pool { border-left: 0; border-top: 1px solid var(--line); max-height: 40dvh; }
}
@media (max-width: 560px) {
  .top { position: static; }
  .top-right { margin-left: 0; }
  .step { padding-right: 10px; }
  .step .lbl-long { display: none; }
  .step .lbl-short { display: inline; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  .top, .banner, .no-print, .toast { display: none !important; }
  body { background: #fff; }
  .ov-card { border-color: #ccc; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="hdr"></header>
  <div id="banner"></div>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ================= data ================= */
const KEY = 'cc-wedding-seating-v1';
const PALETTE = ['#C9D5BE', '#EFCFC7', '#CBDCE6', '#DED2E8', '#EEDFB8', '#C6DFD3', '#F1D3BA', '#E5C8D6', '#D8D1C2', '#BFD3DA', '#E2E3BC', '#D9C3B0'];
const DECOR_KINDS = { stage: '舞台', dance: '舞池', door: '入口', host: '主持台', dessert: '甜點桌', photo: '拍照區', gift: '收禮台', bar: '吧台', custom: '標示' };
const SHAPES = { round: '圓桌', long: '長桌（兩側坐）', head: '主桌長桌（單側坐）' };
const IFRAMED = (() => { try { return window.self !== window.top; } catch { return true; } })();

const uid = () => Math.random().toString(36).slice(2, 9);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const isNumName = n => /^\d+$/.test(String(n).trim());

function emptyState() {
  return { v: 1, sample: false, snap: true, room: { w: 1400, h: 900 }, guests: [], tables: [], decor: [
    { id: uid(), kind: 'stage', label: '舞台', x: 700, y: 70, w: 420, h: 84 },
    { id: uid(), kind: 'door', label: '入口', x: 700, y: 880, w: 170, h: 34 },
  ], seat: {} };
}

function sampleState() {
  const s = emptyState();
  s.sample = true;
  const raw = `陳建宏, 新郎親友
陳林秀英, 新郎親友
陳怡君, 新郎親友
陳俊傑, 新郎親友
黃國華, 新郎親友

}
function validState(d) { return d && d.v === 1 && Array.isArray(d.guests) && Array.isArray(d.tables) && Array.isArray(d.decor) && d.seat && d.room; }

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); savedAt = new Date(); } catch { savedAt = null; }

function savedNote() {

function pushHistory() { history.push(JSON.stringify(state)); if (history.length > 80) history.shift(); }

/* ================= helpers ================= */
function parseGuests(text) {
  const out = [];
  for (let line of String(text).split(/\r?\n/)) {
    line = line.trim();
    if (!line) continue;
    let parts = line.includes('\t') ? line.split('\t') : line.split(/[,，]/);
    parts = parts.map(p => p.trim().replace(/^"(.*)"$/, '$1'));
    let name = parts[0] || '';
    const group = parts[1] || '';
    const note = parts.slice(2).filter(Boolean).join(' ');
    if (!name || /^(姓名|名字|賓客|name)$/i.test(name)) continue;
    let extra = 0;
    const m = name.match(/^(.*?)\s*[+＋]\s*(\d{1,2})$/);
    if (m && m[1]) { name = m[1].trim(); extra = Math.min(+m[2], 20); }
    out.push({ name, group, note });
    for (let i = 1; i <= extra; i++) out.push({ name: `${name}+${i}`, group, note: '同行' });
  }
  return out;
}

const gById = () => Object.fromEntries(state.guests.map(g => [g.id, g]));
const tById = id => state.tables.find(t => t.id === id);

function groups() {
  const order = [];
  for (const g of state.guests) { const k = g.group || ''; if (!order.includes(k)) order.push(k); }
  return order;
}
function groupColor(group) {
  const i = groups().indexOf(group || '');
  return PALETTE[(i < 0 ? 0 : i) % PALETTE.length];
}
const groupLabel = g => g || '未分組';

function tLabel(t) { return isNumName(t.name) ? `第 ${t.name} 桌` : (t.name || '未命名'); }

/* Seat occupancy per table; drops dangling assignments. */
function occ() {
  const m = {};
  for (const t of state.tables) m[t.id] = new Array(t.seats).fill(null);
  const valid = new Set(state.guests.map(g => g.id));
  for (const [gid, a] of Object.entries(state.seat)) {
    const row = m[a.t];
    if (!valid.has(gid) || !row || a.s >= row.length || row[a.s]) { delete state.seat[gid]; continue; }
    row[a.s] = gid;
  }
  return m;
}
const freeCount = t => occ()[t.id].filter(x => !x).length;
function unseated() {
  const order = groups();
  return state.guests.filter(g => !state.seat[g.id])
    .map((g, i) => ({ g, i }))
    .sort((a, b) => order.indexOf(a.g.group || '') - order.indexOf(b.g.group || '') || a.i - b.i)
    .map(x => x.g);
}

function shortName(name) {
  const m = name.match(/^(.*)\+(\d+)$/);
  if (m) return `${shortName(m[1]).slice(0, 2)}+${m[2]}`;
  if (/[㐀-鿿]/.test(name)) return name.length <= 3 ? name : name.slice(-2);
  const w = name.split(/\s+/)[0];
  return w.length > 6 ? w.slice(0, 5) + '…' : w;
}

/* Table geometry. k scales everything; seats are listed clockwise from the top. */
function geom(t, k = 1) {
  const n = t.seats, sr = 17 * k, gap = 5 * k;
  if (t.shape === 'round') {
    const R = Math.max(40, 20 + n * 4.3) * k, ring = R + gap + sr, half = ring + sr + 3 * k;
    const seats = [];
    for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / n; seats.push({ x: Math.cos(a) * ring, y: Math.sin(a) * ring }); }
    return { w: half * 2, h: half * 2, top: { w: R * 2, h: R * 2, round: true }, seats, sr };
  }
  const pitch = 40 * k, seats = [];
  if (t.shape === 'long') {
    const per = Math.ceil(n / 2), bottom = n - per, tw = per * pitch + 12 * k, th = 60 * k;
    const x0 = -tw / 2 + 6 * k + pitch / 2;
    for (let i = 0; i < per; i++) seats.push({ x: x0 + i * pitch, y: -th / 2 - gap - sr });
    for (let j = 0; j < bottom; j++) seats.push({ x: x0 + (per - 1 - j) * pitch, y: th / 2 + gap + sr });
    return { w: tw + 8 * k, h: th + 2 * (gap + 2 * sr) + 6 * k, top: { w: tw, h: th }, seats, sr };
  }
  const tw = n * pitch + 12 * k, th = 50 * k, x0 = -tw / 2 + 6 * k + pitch / 2;
  for (let i = 0; i < n; i++) seats.push({ x: x0 + i * pitch, y: th / 2 + gap + sr });
  return { w: tw + 8 * k, h: th + 2 * (gap + 2 * sr) + 6 * k, top: { w: tw, h: th }, seats, sr };
}

/* ================= seating logic ================= */
function dropGuests(ids, target) {
  const G = gById();
  ids = ids.filter(id => G[id]);
  if (!ids.length) return;
  if (target.type === 'pool') { ids.forEach(id => delete state.seat[id]); return; }
  const t = tById(target.table);
  if (!t) return;

  if (target.type === 'seat' && ids.length === 1) {
    const g = ids[0], s = target.seat, cur = occ()[t.id][s];
    if (cur === g) return;
    const from = state.seat[g];
    state.seat[g] = { t: t.id, s };
    if (cur) {
      if (from) state.seat[cur] = from;          // swap places
      else {
        const e = occ()[t.id].findIndex(x => !x);
        if (e >= 0) state.seat[cur] = { t: t.id, s: e };
        else { delete state.seat[cur]; toast(`${G[cur].name} 移回未入座名單`); }
      }
    }
    return;
  }

  let start = target.type === 'seat' ? target.seat : 0;
  const left = [];
  for (const id of ids) {
    const a = state.seat[id];
    if (a && a.t === t.id && target.type === 'table') continue;
    const row = occ()[t.id];
    let e = -1;
    for (let k = 0; k < row.length; k++) { const i = (start + k) % row.length; if (!row[i] || row[i] === id) { e = i; break; } }
    if (e < 0) { left.push(id); continue; }
    state.seat[id] = { t: t.id, s: e };
    start = e;
  }
  if (left.length) toast(`${tLabel(t)}坐滿了，還有 ${left.length} 位沒有排進去`);
}

function setSeats(t, n) {
  n = clamp(Math.round(n) || 0, 2, 24);
  if (n === t.seats) return;
  t.seats = n;
  const G = gById(), moved = [];
  for (const [gid, a] of Object.entries(state.seat)) {
    if (a.t !== t.id || a.s < n) continue;
    delete state.seat[gid];
    const e = occ()[t.id].findIndex(x => !x);
    if (e >= 0) state.seat[gid] = { t: t.id, s: e }; else moved.push(G[gid]?.name);
  }
  if (moved.length) toast(`${moved.join('、')} 移回未入座名單`);
}

function autoFill() {
  const list = unseated();
  if (!list.length) { toast('所有賓客都已經入座'); return; }
  if (!state.tables.length) { toast('先到「桌位配置」建立桌子'); return; }
  const G = gById();
  const byGroup = new Map();
  for (const g of list) { const k = g.group || ''; if (!byGroup.has(k)) byGroup.set(k, []); byGroup.get(k).push(g.id); }
  pushHistory();
  let placed = 0;
  for (const [grp, ids] of byGroup) {
    const rem = ids.slice();
    while (rem.length) {
      const o = occ();
      const frees = state.tables.map(t => ({ t, f: o[t.id].filter(x => !x).length, same: o[t.id].some(x => x && (G[x].group || '') === grp) })).filter(x => x.f > 0);
      if (!frees.length) break;
      const pick = frees.find(x => x.same && x.f >= rem.length) || frees.find(x => x.f >= rem.length && o[x.t.id].every(v => !v)) || frees.find(x => x.f >= rem.length) || frees.reduce((a, b) => (b.f > a.f ? b : a));
      const take = rem.splice(0, pick.f);
      dropGuests(take, { type: 'table', table: pick.t.id });
      placed += take.length;
    }
  }
  save(); render();
  const remain = unseated().length;
  toast(remain ? `排入 ${placed} 位，還有 ${remain} 位因為座位不夠沒排進去` : `已依分組排入 ${placed} 位`);
}

function nextTableName() {
  const nums = state.tables.map(t => t.name).filter(isNumName).map(Number);
  return String(nums.length ? Math.max(...nums) + 1 : 1);
}

function generateTables(count, seats) {
  count = clamp(count | 0, 1, 80); seats = clamp(seats | 0, 2, 24);
  const probe = geom({ shape: 'round', seats }), cell = Math.ceil(probe.w + 46);
  const W = state.room.w;
  const hasStage = state.decor.some(d => d.kind === 'stage');
  const y0 = hasStage ? 160 : 60;
  const cols = Math.max(1, Math.floor((W - 60) / cell));
  const rows = Math.ceil(count / cols);
  state.room.h = Math.max(state.room.h, y0 + rows * cell + 80);
  state.tables = []; state.seat = {};
  for (let i = 0; i < count; i++) {
    const r = Math.floor(i / cols), c = i % cols;
    const inRow = Math.min(cols, count - r * cols);
    const xStart = (W - inRow * cell) / 2 + cell / 2;
    state.tables.push({ id: uid(), name: String(i + 1), note: '', shape: 'round', seats, x: Math.round(xStart + c * cell), y: Math.round(y0 + cell / 2 + r * cell) });
  }
  const door = state.decor.find(d => d.kind === 'door');
  if (door) door.y = state.room.h - 22;
}

function viewCenter() {
  const fs = $('#floorScroll');
  if (!fs) return { x: state.room.w / 2, y: state.room.h / 2 };
  return { x: Math.round((fs.scrollLeft + fs.clientWidth / 2) / ui.scale), y: Math.round((fs.scrollTop + fs.clientHeight / 2) / ui.scale) };
}

}

function matches(g, q) { if (!q) return true; q = q.toLowerCase(); return [g.name, g.group, g.note].some(v => (v || '').toLowerCase().includes(q)); }

        <div class="stepper"><button class="iconbtn" data-act="seats" data-id="${item.id}" data-d="-1" aria-label="減少座位">−</button><output>${item.seats}</output><button class="iconbtn" data-act="seats" data-id="${item.id}" data-d="1" aria-label="增加座位">+</button></div></div>
      <div class="row"><button class="btn small" data-act="dupSel">複製這桌</button><button class="btn small" data-act="delSel" data-confirm="再按一次刪除">刪除這桌</button></div>
    </div>`;
  } else if (item) {
    props = `<div class="stack">
      <div class="grid2"><label class="f">文字<input type="text" data-prop="label" value="${esc(item.label)}"></label><label class="f">類型<select data-prop="kind">${Object.entries(DECOR_KINDS).map(([k, v]) => `<option value="${k}" ${item.kind === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div>
      <div class="grid2"><label class="f">寬<input type="number" min="20" max="2000" step="10" data-prop="w" value="${item.w}"></label><label class="f">高<input type="number" min="20" max="2000" step="10" data-prop="h" value="${item.h}"></label></div>
      <div class="row"><button class="btn small" data-act="delSel" data-confirm="再按一次刪除">刪除</button></div>
    </div>`;
  }
  return `<div class="panel">
      <h2>快速建立桌位 <small>${need} 位賓客，大約需要 ${suggest} 桌</small></h2>
      <div class="grid2" style="margin-top:10px"><label class="f">桌數<input type="number" id="genCount" min="1" max="80" value="${state.tables.length || suggest}"></label><label class="f">每桌人數<input type="number" id="genSeats" min="2" max="24" value="10"></label></div>
      <button class="btn wide" style="margin-top:10px" data-act="gen" ${state.tables.length ? 'data-confirm="會重排所有桌子並清空座位，再按一次"' : ''}>自動排出圓桌</button>
      <div class="eyebrow">加一張桌子</div>
      <div class="row"><button class="btn small" data-act="addTable" data-shape="round">＋ 圓桌</button><button class="btn small" data-act="addTable" data-shape="long">＋ 長桌</button><button class="btn small" data-act="addTable" data-shape="head">＋ 主桌長桌</button></div>
      <div class="eyebrow">加場地標示</div>
      <div class="row"><select id="decorKind" style="flex:1">${Object.entries(DECOR_KINDS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select><button class="btn small" data-act="addDecor">＋ 加入</button></div>
    </div>
    <div class="panel">
      <h2>${item ? (sel.kind === 'table' ? esc(tLabel(item)) : esc(item.label)) : '選取的項目'}</h2>
      <div style="margin-top:10px">${props}</div>
    </div>
    <div class="panel">
      <h2>場地</h2>
      <div class="grid2" style="margin-top:10px"><label class="f">寬<input type="number" id="roomW" min="400" max="5000" step="50" value="${state.room.w}"></label><label class="f">高<input type="number" id="roomH" min="300" max="5000" step="50" value="${state.room.h}"></label></div>
      <label class="check" style="margin-top:10px"><input type="checkbox" id="snap" ${state.snap !== false ? 'checked' : ''}> 拖曳時對齊格線</label>
      <button class="btn primary wide" style="margin-top:14px" data-act="step" data-step="assign">桌位確認，開始安排入座 →</button>
    </div>`;
}

function canvasHTML(mode) {
  const { w, h } = state.room, s = ui.scale;
  const title = mode === 'layout' ? '平面圖 · 拖曳桌子調整位置' : '平面圖 · 把賓客拖到桌上，點桌子可以細調座位';
  return `<section class="panel canvas-panel">
    <div class="canvas-bar"><span class="title">${title}</span>
      <button class="iconbtn" data-act="zoom" data-d="-1" aria-label="縮小">−</button><span class="zoom">${Math.round(s * 100)}%</span><button class="iconbtn" data-act="zoom" data-d="1" aria-label="放大">+</button><button class="btn small" data-act="fit">符合畫面</button>
    </div>
    <div class="floor-scroll" id="floorScroll"><div class="floor-size" style="width:${w * s}px;height:${h * s}px">
      <div class="floor ${mode}" id="floor" style="width:${w}px;height:${h}px;transform:scale(${s})">${floorInnerHTML(mode)}</div>
    </div></div>
  </section>`;
}

function floorInnerHTML(mode) {
  const o = occ(), G = gById();
  const decor = state.decor.map(d => `<div class="decor k-${d.kind} ${ui.selected?.id === d.id ? 'sel' : ''}" style="left:${d.x}px;top:${d.y}px;width:${d.w}px;height:${d.h}px" ${mode === 'layout' ? `data-move="decor" data-id="${d.id}"` : ''}>${esc(d.label)}</div>`).join('');
  const tables = state.tables.map(t => tableHTML(t, o[t.id], G, mode, 1)).join('');
  return decor + tables + `<div class="floor-label">${state.room.w} × ${state.room.h}</div>`;
}

function tableHTML(t, row, G, mode, k) {
  const g = geom(t, k), filled = row.filter(Boolean).length, big = k > 1;
  const assign = mode === 'assign' || big;
  const attrs = big ? `data-drop="table" data-table="${t.id}"`
    : mode === 'layout' ? `data-move="table" data-id="${t.id}"`
    : `data-drop="table" data-table="${t.id}" data-act="openTable" data-id="${t.id}" title="${esc(tLabel(t))}：點一下放大調整座位"`;
  const seats = g.seats.map((p, i) => {
    const gid = row[i], guest = gid && G[gid];
    const style = `left:${g.w / 2 + p.x}px;top:${g.h / 2 + p.y}px;width:${g.sr * 2}px;height:${g.sr * 2}px;margin:${-g.sr}px 0 0 ${-g.sr}px;${guest ? `--g:${groupColor(guest.group)}` : ''}`;
    const drop = assign ? `data-drop="seat" data-table="${t.id}" data-seat="${i}"` : '';
    const drag = guest && assign ? `data-drag="seat" data-id="${gid}"` : '';
    let inner;
    if (big) inner = `<span class="no">${i + 1}</span>${guest ? `<span class="nm">${esc(guest.name)}${guest.note ? `<span class="nt">${esc(guest.note)}</span>` : ''}</span>` : ''}`;
    else inner = guest ? esc(shortName(guest.name)) : `<span class="no">${i + 1}</span>`;
    return `<div class="seat ${guest ? 'filled' : ''} ${big ? 'big' : ''}" style="${style}" ${drop} ${drag} ${guest ? `title="${i + 1} 號 · ${esc(guest.name)}${guest.group ? ' · ' + esc(guest.group) : ''}"` : ''}>${inner}</div>`;
  }).join('');
  const word = !isNumName(t.name);
  const pos = big ? '' : `left:${t.x}px;top:${t.y}px;`;
  return `<div class="tbl ${ui.selected?.id === t.id && mode === 'layout' ? 'sel' : ''}" style="${pos}width:${g.w}px;height:${g.h}px" ${attrs}>
    <div class="tbl-top ${g.top.round ? 'round' : 'rect'}" style="width:${g.top.w}px;height:${g.top.h}px">
      <span class="tbl-num ${word ? 'word' : ''}">${esc(t.name || '?')}</span>
      ${t.note && (g.top.h > 70 || !g.top.round) ? `<span class="tbl-sub">${esc(t.note)}</span>` : ''}
      <span class="cnt ${filled === t.seats ? 'full' : ''}">${filled}/${t.seats}</span>
    </div>${seats}</div>`;
}

/* ---------- step 3 ---------- */
function poolHTML() {
  const list = unseated();
  return `<h2>未入座賓客 <small>${list.length} 位</small></h2>
    <p class="hint">把名字拖到桌子上，會依照放進去的順序坐下；拖到某個座位上可以指定位子。先點選多位可以一起拖。拖回這裡就會移出座位。</p>
    <input type="search" id="pSearch" placeholder="搜尋姓名" value="${esc(ui.pSearch)}">
    <div class="gchips" id="poolChips">${groupChipsHTML(ui.pFilter, 'pFilter', list)}</div>
    <div id="selBar">${selBarHTML()}</div>
    <div class="pool-list" id="poolList">${poolListHTML(ui.pSearch, ui.pFilter)}</div>
    <div class="row" style="margin-top:10px"><button class="btn small" data-act="autoFill">依分組自動排入剩下的人</button><button class="btn small quiet" data-act="clearAll" data-confirm="全部清空？再按一次">清空所有座位</button></div>`;
}

function selBarHTML() {
  const n = [...ui.sel].filter(id => !state.seat[id]).length;
  return n ? `<div class="selbar">已選 ${n} 位，拖曳其中一位就會一起移動<button class="btn small quiet" data-act="selClear">取消</button></div>` : '';
}

function poolListHTML(q, filter) {
  const list = unseated().filter(g => matches(g, q) && (filter === '' || (g.group || '') === filter));
  if (!state.guests.length) return `<div class="done-note">還沒有賓客，先到「賓客名單」匯入</div>`;
  if (!unseated().length) return `<div class="done-note">所有賓客都入座了 ✓</div>`;
  if (!list.length) return `<div class="empty">找不到符合的賓客</div>`;
  const by = new Map();
  for (const g of list) { const k = g.group || ''; if (!by.has(k)) by.set(k, []); by.get(k).push(g); }
  return [...by].map(([grp, gs]) => `<div class="ghead" style="--g:${groupColor(grp)}"><span class="dot"></span>${esc(groupLabel(grp))} · ${gs.length}<button class="btn small quiet" data-act="selGroup" data-group="${esc(grp)}">全選</button></div>
    <div class="chips">${gs.map(g => `<div class="chip ${ui.sel.has(g.id) ? 'sel' : ''}" tabindex="0" role="button" aria-pressed="${ui.sel.has(g.id)}" data-drag="pool" data-act="selToggle" data-id="${g.id}" style="--g:${groupColor(g.group)}"><span class="dot"></span><span>${esc(g.name)}</span>${g.note ? `<span class="nt">${esc(g.note)}</span>` : ''}</div>`).join('')}</div>`).join('');
}

/* ---------- table modal ---------- */
function renderModal() {
  const root = $('#modalRoot');
  const t = ui.modal && tById(ui.modal);
  if (!t) { ui.modal = null; root.innerHTML = ''; return; }
  const o = occ()[t.id], G = gById();
  const avail = Math.min(window.innerWidth - 60, window.innerWidth > 980 ? 700 : 560);
  const k = clamp(avail / geom(t, 1).w, 1.15, 2.1);
  root.innerHTML = `<div class="modal-back" data-act="closeModal">
    <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(tLabel(t))}">
      <div class="modal-head">
        <label class="f">桌名 / 桌號<input type="text" id="mName" value="${esc(t.name)}"></label>
        <label class="f" style="flex:2 1 200px">備註<input type="text" id="mNote" value="${esc(t.note)}" placeholder="例如：新娘大學同學"></label>
        <div class="f"><span>座位數</span><div class="stepper"><button class="iconbtn" data-act="seats" data-id="${t.id}" data-d="-1" aria-label="減少座位">−</button><output>${t.seats}</output><button class="iconbtn" data-act="seats" data-id="${t.id}" data-d="1" aria-label="增加座位">+</button></div></div>
        <button class="iconbtn" data-act="closeModal" aria-label="關閉" style="margin-left:auto">✕</button>
      </div>
      <div class="modal-body">
        <div class="big-wrap">${tableHTML(t, o, G, 'assign', k)}</div>
        <aside class="modal-pool" data-drop="pool">
          <h2 style="font-family:var(--f-serif-tc);font-size:15px">未入座 <small style="font-size:12px;color:var(--ink-soft);font-weight:400">${unseated().length} 位</small></h2>
          <input type="search" id="mSearch" placeholder="搜尋姓名" value="${esc(ui.mSearch)}" style="margin-top:8px">
          <div class="pool-list" id="mPoolList">${poolListHTML(ui.mSearch, '')}</div>
        </aside>
      </div>
      <div class="modal-foot">
        <p class="hint">拖曳名字到另一個座位會互換位子；拖到右邊名單就移出這桌。座位從正上方 1 號開始順時針編號。</p>
        <button class="btn small quiet" data-act="clearTable" data-id="${t.id}" data-confirm="清空這桌？再按一次">清空這桌</button>
        <button class="btn primary" data-act="closeModal">完成</button>
      </div>
    </div></div>`;
}

/* ---------- step 4 ---------- */
function sortedTables() {
  return state.tables.slice().sort((a, b) => {
    const na = isNumName(a.name), nb = isNumName(b.name);
    if (na !== nb) return na ? 1 : -1;
    return String(a.name).localeCompare(String(b.name), 'zh-Hant', { numeric: true });
  });
}
function csvText() {
  const o = occ(), G = gById(), q = v => /[",\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const lines = [['桌號', '桌位備註', '座位', '姓名', '分組', '賓客備註'].join(',')];
  for (const t of sortedTables()) o[t.id].forEach((gid, i) => { if (gid) { const g = G[gid]; lines.push([t.name, t.note || '', i + 1, g.name, g.group || '', g.note || ''].map(q).join(',')); } });
  unseated().forEach(g => lines.push(['未入座', '', '', g.name, g.group || '', g.note || ''].map(q).join(',')));
  return lines.join('\n');
}
function overviewHTML() {
  const o = occ(), G = gById(), left = unseated();
  const cards = sortedTables().map(t => {
    const row = o[t.id], n = row.filter(Boolean).length;
    return `<article class="ov-card"><h3>${esc(tLabel(t))}<span class="cnt ${n === t.seats ? 'full' : ''}">${n}/${t.seats}</span></h3>
      ${t.note ? `<div class="sub">${esc(t.note)}</div>` : ''}
      <ol>${row.map((gid, i) => { const g = gid && G[gid]; return g ? `<li><span class="sn">${i + 1}</span><span class="dot" style="--g:${groupColor(g.group)}"></span><span>${esc(g.name)}${g.note ? `<span class="nt">${esc(g.note)}</span>` : ''}</span></li>` : `<li class="emp"><span class="sn">${i + 1}</span><span></span><span>空位</span></li>`; }).join('')}</ol></article>`;
  }).join('');
  return `<section>
    <div class="row no-print" style="margin-top:16px;justify-content:space-between">
      <div class="gchips" style="margin:0">${groups().map(g => `<span class="gchip" style="--g:${groupColor(g)};cursor:default"><span class="dot"></span>${esc(groupLabel(g))}</span>`).join('')}</div>
      ${IFRAMED ? '' : '<button class="btn" data-act="print">列印座位表</button>'}
    </div>
    ${state.tables.length ? `<div class="ov-grid">${cards}</div>` : `<div class="panel empty" style="margin-top:16px">還沒有桌子，先到「桌位配置」建立。</div>`}
    ${left.length ? `<div class="panel" style="margin-top:12px"><h2>未入座 <small>${left.length} 位</small></h2><p style="margin:8px 0 0">${left.map(g => esc(g.name)).join('、')}</p></div>` : ''}
    <div class="export no-print">
      <div class="panel"><h2>座位表 CSV</h2><p class="hint">可以貼到 Excel / Google Sheet，或給場地與婚顧。</p><textarea id="csvOut" readonly>${esc(csvText())}</textarea>
        <div class="row" style="margin-top:8px"><button class="btn small" data-act="copy" data-src="csvOut">複製</button>${IFRAMED ? '' : '<button class="btn small" data-act="download" data-kind="csv">下載 .csv</button>'}</div></div>
      <div class="panel"><h2>備份</h2><p class="hint">資料只存在這台裝置的瀏覽器。換電腦或清除瀏覽紀錄前，先複製備份存起來；要還原時貼回下面再按「匯入備份」。</p><textarea id="jsonOut" readonly>${esc(JSON.stringify(state))}</textarea>
        <div class="row" style="margin-top:8px"><button class="btn small" data-act="copy" data-src="jsonOut">複製備份</button>${IFRAMED ? '' : '<button class="btn small" data-act="download" data-kind="json">下載備份檔</button>'}</div></div>
      <div class="panel"><h2>匯入備份</h2><p class="hint">會取代目前所有名單、桌位和座位。</p><textarea id="jsonIn" placeholder="把備份文字貼在這裡"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn small" data-act="importJSON" data-confirm="會取代目前資料，再按一次">匯入備份</button><label class="btn small file">讀取備份檔<input type="file" id="fileBackup" accept=".json,application/json"></label></div></div>
    </div>
  </section>`;
}

/* ================= zoom ================= */
function fit() {
  const fs = $('#floorScroll');
  if (!fs) return;
  const s = Math.min((fs.clientWidth - 8) / state.room.w, (fs.clientHeight - 8) / state.room.h);
  ui.scale = clamp(Math.floor(s * 100) / 100, 0.25, 1.6);
  render();
}
function zoom(d) {
  ui.autoFit = false;
  ui.scale = clamp(Math.round((ui.scale + d * 0.1) * 10) / 10, 0.25, 2);
  render();
}

/* ================= toast & confirm ================= */
let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2800);
}
function confirmed(btn) {
  if (!btn.dataset.confirm) return true;
  if (btn.dataset.armed === '1') return true;
  btn.dataset.armed = '1'; btn.dataset.orig = btn.textContent; btn.textContent = btn.dataset.confirm; btn.classList.add('armed');
  setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ''; btn.textContent = btn.dataset.orig; btn.classList.remove('armed'); } }, 3500);
  return false;
}

/* ================= actions ================= */
function addGuests(list, replace) {
  if (!list.length) { toast('沒有讀到任何名字，確認一下格式'); return; }
  commit(() => {
    // pasting a real list always clears the sample guests
    if (replace || state.sample) { state.guests = []; state.seat = {}; }
    state.sample = false;
    state.guests.push(...list.map(g => ({ id: uid(), ...g })));
  });
  const box = $('#pasteBox'); if (box) box.value = '';
  toast(`已加入 ${list.length} 位賓客`);
}

async function copyFrom(id) {
  const ta = $('#' + id);
  try { await navigator.clipboard.writeText(ta.value); toast('已複製'); }
  catch { ta.focus(); ta.select(); toast('已選取全部文字，按 Ctrl/⌘ + C 複製'); }
}

function download(kind) {
  const stamp = new Date().toISOString().slice(0, 10);
  const data = kind === 'csv' ? '﻿' + csvText() : JSON.stringify(state, null, 1);
  const blob = new Blob([data], { type: kind === 'csv' ? 'text/csv' : 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = kind === 'csv' ? `座位表-${stamp}.csv` : `座位備份-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function importState(text) {
  let d;
  try { d = JSON.parse(text); } catch { toast('備份格式不對，請貼上完整的備份文字'); return; }
  if (!validState(d)) { toast('這不是座位工具的備份'); return; }
  commit(() => { state = d; ui.selected = null; ui.sel.clear(); });
  toast(`已匯入：${state.guests.length} 位賓客、${state.tables.length} 桌`);
}

const actions = {
  step(el) { ui.step = el.dataset.step; ui.selected = null; render(); if ((ui.step === 'layout' || ui.step === 'assign') && ui.autoFit) fit(); window.scrollTo({ top: 0 }); },
  undo,
  keepSample() { state.sample = false; save(); render(); },
  blank() { commit(() => { state = emptyState(); ui.sel.clear(); ui.selected = null; }); toast('已清空，從貼上名單開始'); },
  append() { addGuests(parseGuests($('#pasteBox').value), false); },
  replace() { addGuests(parseGuests($('#pasteBox').value), true); },
  addOne() {
    const name = $('#oneName').value.trim();
    if (!name) { $('#oneName').focus(); toast('請先輸入姓名'); return; }
    addGuests([{ name, group: $('#oneGroup').value.trim(), note: $('#oneNote').value.trim() }], false);
    $('#oneName').focus();
  },
  delGuest(el) { const g = gById()[el.dataset.id]; commit(() => { state.guests = state.guests.filter(x => x.id !== el.dataset.id); delete state.seat[el.dataset.id]; }); toast(`已刪除 ${g?.name ?? ''}`); },
  gFilter(el) { ui.gFilter = el.dataset.group; render(); },
  pFilter(el) { ui.pFilter = el.dataset.group; $('#poolList').innerHTML = poolListHTML(ui.pSearch, ui.pFilter); $('#poolChips').innerHTML = groupChipsHTML(ui.pFilter, 'pFilter', unseated()); },
  gen() {
    const n = +$('#genCount').value, s = +$('#genSeats').value;
    commit(() => { generateTables(n, s); ui.selected = null; });
    if (ui.autoFit) fit();
    toast(`已排出 ${state.tables.length} 桌，每桌 ${state.tables[0]?.seats} 位`);
  },
  addTable(el) {
    const shape = el.dataset.shape, c = viewCenter();
    const t = { id: uid(), name: shape === 'head' ? '主桌' : nextTableName(), note: '', shape, seats: shape === 'round' ? 10 : shape === 'long' ? 12 : 8, x: c.x, y: c.y };
    commit(() => { state.tables.push(t); ui.selected = { kind: 'table', id: t.id }; });
  },
  addDecor() {
    const kind = $('#decorKind').value, c = viewCenter();
    const size = { stage: [420, 84], dance: [260, 160], door: [170, 34], dessert: [70, 180], bar: [70, 180], photo: [160, 110] }[kind] || [140, 60];
    const d = { id: uid(), kind, label: DECOR_KINDS[kind], x: c.x, y: c.y, w: size[0], h: size[1] };
    commit(() => { state.decor.push(d); ui.selected = { kind: 'decor', id: d.id }; });
  },
  dupSel() {
    const t = ui.selected && tById(ui.selected.id); if (!t) return;
    const c = { ...t, id: uid(), name: isNumName(t.name) ? nextTableName() : t.name + ' 2', x: t.x + 60, y: t.y + 60 };
    commit(() => { state.tables.push(c); ui.selected = { kind: 'table', id: c.id }; });
  },
  delSel() { deleteSelected(); },
  seats(el) { const t = tById(el.dataset.id); if (t) commit(() => setSeats(t, t.seats + Number(el.dataset.d))); },
  zoom(el) { zoom(Number(el.dataset.d)); },
  fit() { ui.autoFit = true; fit(); },
  openTable(el) { ui.modal = el.dataset.id; ui.mSearch = ''; renderModal(); },
  closeModal(el, e) { if (el.classList.contains('modal-back') && e.target !== el) return; ui.modal = null; render(); },
  clearTable(el) { commit(() => { for (const [g, a] of Object.entries(state.seat)) if (a.t === el.dataset.id) delete state.seat[g]; }); },
  autoFill,
  clearAll() { commit(() => { state.seat = {}; }); toast('已清空所有座位'); },
  selToggle(el) { const id = el.dataset.id; ui.sel.has(id) ? ui.sel.delete(id) : ui.sel.add(id); refreshPools(); },
  selGroup(el) {
    const grp = el.dataset.group, ids = unseated().filter(g => (g.group || '') === grp).map(g => g.id);
    const allOn = ids.every(id => ui.sel.has(id));
    ids.forEach(id => allOn ? ui.sel.delete(id) : ui.sel.add(id));
    refreshPools();
  },
  selClear() { ui.sel.clear(); refreshPools(); },
  copy(el) { copyFrom(el.dataset.src); },
  download(el) { download(el.dataset.kind); },
  print() { window.print(); },
  importJSON() { importState($('#jsonIn').value); },
};

function refreshPools() {
  const pl = $('#poolList'); if (pl) { const st = pl.scrollTop; pl.innerHTML = poolListHTML(ui.pSearch, ui.pFilter); pl.scrollTop = st; }
  const ml = $('#mPoolList'); if (ml) { const st = ml.scrollTop; ml.innerHTML = poolListHTML(ui.mSearch, ''); ml.scrollTop = st; }
  const sb = $('#selBar'); if (sb) sb.innerHTML = selBarHTML();
}

function deleteSelected() {
  const sel = ui.selected; if (!sel) return;
  commit(() => {
    if (sel.kind === 'table') {
      state.tables = state.tables.filter(t => t.id !== sel.id);
      for (const [g, a] of Object.entries(state.seat)) if (a.t === sel.id) delete state.seat[g];
    } else state.decor = state.decor.filter(d => d.id !== sel.id);
    ui.selected = null;
  });
}

/* ================= events ================= */
document.addEventListener('click', e => {
  if (ui.justDragged) return;
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (!fn) return;
  if (!confirmed(el)) return;
  fn(el, e);
});

document.addEventListener('keydown', e => {
  const typing = e.target.closest('input, textarea, select');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); return; }
  if (e.key === 'Escape') { if (ui.modal) { ui.modal = null; render(); } else if (ui.selected) { ui.selected = null; render(); } else if (ui.sel.size) { ui.sel.clear(); refreshPools(); } return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && !typing && ui.step === 'layout' && ui.selected) { e.preventDefault(); deleteSelected(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.chip')) { e.preventDefault(); actions.selToggle(e.target); }
  if (e.key === 'Enter' && e.target.matches('#oneName, #oneGroup, #oneNote')) actions.addOne();
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'gSearch') { ui.gSearch = t.value; $('#guestTableWrap').innerHTML = guestRowsHTML(); }
  else if (t.id === 'pSearch') { ui.pSearch = t.value; $('#poolList').innerHTML = poolListHTML(ui.pSearch, ui.pFilter); }
  else if (t.id === 'mSearch') { ui.mSearch = t.value; $('#mPoolList').innerHTML = poolListHTML(ui.mSearch, ''); }
  else if (t.dataset.prop && ui.selected) {
    const item = ui.selected.kind === 'table' ? tById(ui.selected.id) : state.decor.find(d => d.id === ui.selected.id);
    if (!item) return;
    if (!t.dataset.pushed) { pushHistory(); t.dataset.pushed = '1'; }
    const p = t.dataset.prop;
    if (p === 'w' || p === 'h') { const v = +t.value; if (v >= 20) item[p] = clamp(v, 20, 5000); }
    else if (p === 'kind') { const old = DECOR_KINDS[item.kind]; item.kind = t.value; if (item.label === old) item.label = DECOR_KINDS[t.value]; }
    else item[p] = t.value;
    save();
    $('#floor').innerHTML = floorInnerHTML('layout');
    if (p === 'shape' || p === 'kind') $('#side').innerHTML = layoutSideHTML();
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.gf) {
    const g = gById()[t.dataset.id]; if (!g) return;
    const v = t.value.trim();
    if (t.dataset.gf === 'name' && !v) { t.value = g.name; toast('姓名不能空白'); return; }
    pushHistory(); g[t.dataset.gf] = v; save();
    $('#hdr').innerHTML = headerHTML();
    if (t.dataset.gf === 'group') {
      $('#groupChips').innerHTML = groupChipsHTML(ui.gFilter, 'gFilter', state.guests);
      $('#groupList').innerHTML = groups().filter(Boolean).map(x => `<option value="${esc(x)}"></option>`).join('');
      const dot = t.closest('.gcell')?.querySelector('.dot'); if (dot) dot.style.setProperty('--g', groupColor(v));
    }
  } else if (t.id === 'mName' || t.id === 'mNote') {
    const tb = tById(ui.modal); if (!tb) return;
    pushHistory(); tb[t.id === 'mName' ? 'name' : 'note'] = t.value.trim(); save();
    $('#main').innerHTML = mainHTML(); $('#hdr').innerHTML = headerHTML();
    const lbl = $('.modal'); if (lbl) lbl.setAttribute('aria-label', tLabel(tb));
  } else if (t.id === 'roomW' || t.id === 'roomH') {
    const v = clamp(+t.value || 0, t.id === 'roomW' ? 400 : 300, 5000);
    commit(() => { state.room[t.id === 'roomW' ? 'w' : 'h'] = v; });
  } else if (t.id === 'snap') { state.snap = t.checked; save(); }
  else if (t.dataset.prop) { delete t.dataset.pushed; $('#side').innerHTML = layoutSideHTML(); }
  else if (t.id === 'fileGuests' || t.id === 'fileBackup') {
    const f = t.files?.[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const text = String(r.result).replace(/^﻿/, '');
      if (t.id === 'fileBackup') { importState(text); return; }
      $('#pasteBox').value = text; toast('已讀取檔案，確認內容後按「加入名單」或「取代整份名單」');
    };
    r.readAsText(f);
  }
});

window.addEventListener('resize', () => {
  clearTimeout(window.__rz);
  window.__rz = setTimeout(() => { if (ui.autoFit && (ui.step === 'layout' || ui.step === 'assign')) fit(); else if (ui.modal) renderModal(); }, 150);
});

/* ---------- dragging: tables & decor in layout mode ---------- */
document.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const mv = e.target.closest('[data-move]');
  if (mv && ui.step === 'layout') { startMove(e, mv); return; }
  const dg = e.target.closest('[data-drag]');
  if (dg) { startGuestDrag(e, dg); return; }
  if (ui.step === 'layout' && e.target.closest('#floor') && ui.selected) { ui.selected = null; $('#side').innerHTML = layoutSideHTML(); document.querySelectorAll('#floor .sel').forEach(n => n.classList.remove('sel')); }
});

function startMove(e, el) {
  const kind = el.dataset.move, id = el.dataset.id;
  const item = kind === 'table' ? tById(id) : state.decor.find(d => d.id === id);
  if (!item) return;
  e.preventDefault();
  const changed = ui.selected?.id !== id;
  ui.selected = { kind, id };
  document.querySelectorAll('#floor .sel').forEach(n => n.classList.remove('sel'));
  el.classList.add('sel');
  if (changed) $('#side').innerHTML = layoutSideHTML();
  const st = { x0: e.clientX, y0: e.clientY, ix: item.x, iy: item.y, moved: false };
  const g = kind === 'table' ? geom(item) : { w: item.w, h: item.h };
  const move = ev => {
    const dx = ev.clientX - st.x0, dy = ev.clientY - st.y0;
    if (!st.moved && Math.hypot(dx, dy) < 3) return;
    if (!st.moved) { pushHistory(); st.moved = true; }
    let nx = st.ix + dx / ui.scale, ny = st.iy + dy / ui.scale;
    if (state.snap !== false) { nx = Math.round(nx / 10) * 10; ny = Math.round(ny / 10) * 10; }
    item.x = clamp(nx, g.w / 2, state.room.w - g.w / 2);
    item.y = clamp(ny, g.h / 2, state.room.h - g.h / 2);
    el.style.left = item.x + 'px'; el.style.top = item.y + 'px';
  };
  const up = () => {
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
    if (st.moved) { save(); $('#hdr').innerHTML = headerHTML(); }
  };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
}

/* ---------- dragging: guests ---------- */
let drag = null;
function startGuestDrag(e, el) {
  const id = el.dataset.id;
  let ids = [id];
  if (el.dataset.drag === 'pool' && ui.sel.has(id)) {
    const picked = unseated().filter(g => ui.sel.has(g.id)).map(g => g.id);
    if (picked.length > 1) ids = picked;
  }
  drag = { ids, el, x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, active: false, touch: e.pointerType === 'touch', target: null };
  if (drag.touch) drag.timer = setTimeout(() => { if (drag && !drag.active) activateDrag(); }, 260);
  else e.preventDefault();
  window.addEventListener('pointermove', onDragMove, { passive: false });
  window.addEventListener('pointerup', onDragEnd);
  window.addEventListener('pointercancel', onDragCancel);
}
function activateDrag() {
  drag.active = true;
  const G = gById();
  const first = G[drag.ids[0]]?.name || '';
  const ghost = document.createElement('div');
  ghost.className = 'ghost';
  ghost.textContent = drag.ids.length > 1 ? `${first} 等 ${drag.ids.length} 位` : first;
  document.body.appendChild(ghost);
  drag.ghost = ghost;
  document.body.classList.add('is-dragging');
  drag.srcEls = drag.ids.map(id => document.querySelectorAll(`[data-drag][data-id="${id}"]`)).flatMap(n => [...n]);
  drag.srcEls.forEach(n => n.classList.add('dragging-src'));
  if (navigator.vibrate && drag.touch) try { navigator.vibrate(10); } catch {}
  placeGhost(drag.lx, drag.ly);
}
function onDragMove(ev) {
  if (!drag) return;
  drag.lx = ev.clientX; drag.ly = ev.clientY;
  const dist = Math.hypot(ev.clientX - drag.x0, ev.clientY - drag.y0);
  if (!drag.active) {
    if (drag.touch) { if (dist > 8) onDragCancel(); return; }
    if (dist < 4) return;
    activateDrag();
  }
  ev.preventDefault();
  placeGhost(ev.clientX, ev.clientY);
}
function placeGhost(x, y) {
  drag.ghost.style.transform = `translate(${x - drag.ghost.offsetWidth / 2}px, ${y - drag.ghost.offsetHeight - 18}px)`;
  const hit = document.elementFromPoint(x, y)?.closest('[data-drop]') || null;
  if (hit !== drag.target) {
    drag.target?.classList.remove('drop-hover');
    hit?.classList.add('drop-hover');
    drag.target = hit;
  }
  const fs = $('#floorScroll');
  if (fs && !ui.modal) {
    const r = fs.getBoundingClientRect(), m = 40, sp = 14;
    if (x > r.left && x < r.right && y > r.top && y < r.bottom) {
      if (x < r.left + m) fs.scrollLeft -= sp; else if (x > r.right - m) fs.scrollLeft += sp;
      if (y < r.top + m) fs.scrollTop -= sp; else if (y > r.bottom - m) fs.scrollTop += sp;
    }
  }
}
function cleanupDrag() {
  clearTimeout(drag.timer);
  window.removeEventListener('pointermove', onDragMove); window.removeEventListener('pointerup', onDragEnd); window.removeEventListener('pointercancel', onDragCancel);
  drag.ghost?.remove();
  drag.target?.classList.remove('drop-hover');
  drag.srcEls?.forEach(n => n.classList.remove('dragging-src'));
  document.body.classList.remove('is-dragging');
}
function onDragCancel() { if (!drag) return; cleanupDrag(); drag = null; }
function onDragEnd(ev) {
  if (!drag) return;
  const d = drag;
  cleanupDrag(); drag = null;
  if (!d.active) return;
  ui.justDragged = true; setTimeout(() => { ui.justDragged = false; }, 60);
  const hit = d.target || document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-drop]');
  if (!hit) return;
  const type = hit.dataset.drop;
  const target = type === 'pool' ? { type } : { type, table: hit.dataset.table, seat: hit.dataset.seat != null ? +hit.dataset.seat : null };
  commit(() => {
    dropGuests(d.ids, target);
    d.ids.forEach(id => ui.sel.delete(id));
  });
}
document.addEventListener('touchmove', e => { if (drag?.active) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-drag]')) e.preventDefault(); });

/* ================= boot ================= */
render();
})();
</script>
</body>
</html>
